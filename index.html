<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Study Magic</title>
<meta name="theme-color" content="#ffd84d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎒</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{ --bg1:#fff6d6; --bg2:#d9f2ff; --ink:#2d2a4a; --muted:#6f6c8f; --shadow:0 8px 0 rgba(45,42,74,.15); }
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
html{background:var(--bg2)}
body{
  font-family:'Fredoka','Comic Sans MS',system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg1),var(--bg2)) fixed;background-color:var(--bg1);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
}
.app{max-width:720px;margin:0 auto;padding:24px 16px 40px;min-height:100vh;display:flex;flex-direction:column}
h1{font-size:clamp(38px,10vw,60px);text-align:center;margin:10px 0 0;line-height:1.1}
.sub{text-align:center;color:var(--muted);font-size:22px;margin:8px 0 26px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  padding:28px 10px;border-radius:30px;text-decoration:none;color:var(--ink);
  box-shadow:var(--shadow);font-size:clamp(26px,7vw,36px);font-weight:700;transition:transform .08s;text-align:center;
}
.choice:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(45,42,74,.15)}
.choice .ic{font-size:clamp(70px,20vw,100px);line-height:1}
.choice small{font-size:18px;font-weight:400;color:var(--muted)}
.en{background:#ffe9a8}.ma{background:#cdeeff}.le{background:#c9f0d8;grid-column:1/-1;flex-direction:row;gap:16px;text-align:left}
.le .ic{font-size:clamp(56px,15vw,80px)}
@media (max-width:380px){ .choices{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="app">
  <h1>🎒 ¡A estudiar!</h1>
  <p class="sub">¿Qué quieres practicar hoy?</p>
  <div class="choices">
    <a class="choice en" href="english.html"><span class="ic">🔤</span>English<small>Dictado de palabras</small></a>
    <a class="choice ma" href="math.html"><span class="ic">🔢</span>Math<small>Sumas y restas</small></a>
    <a class="choice le" href="lectura.html"><span class="ic">📖</span><span>Lectura<br><small>El calcetín de Agustín</small></span></a>
  </div>
</div>
</body>
</html>
